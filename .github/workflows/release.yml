name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" =~ (Bump\ v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "tag=v${BASH_REMATCH[1]#Bump v}" >> "$GITHUB_OUTPUT"
          else
            echo "The latest commit does not contain 'Bump vX.Y.Z'; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find release archive
        id: archive
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          archive="$(find Release -maxdepth 1 -type f -iname '*.zip' -print 2>/dev/null | sort | head -n 1)"
          if [[ -z "$archive" ]]; then
            echo "No ZIP archive was found in Release/." >&2
            exit 1
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Town Cleanup ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.archive.outputs.path }}